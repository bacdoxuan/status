owner: bacdoxuan
repo: status

sites:
  - name: Web App
    url: https://simplemoneytracker.com
    expectedStatusCodes:
      - 200
  - name: Login
    url: https://simplemoneytracker.com/login
    expectedStatusCodes:
      - 200
  - name: Telegram Bot
    url: https://simplemoneytracker.com/api/telegram/webhook
    expectedStatusCodes:
      - 405

status-website:
  # Served at https://bacdoxuan.github.io/status/ until the custom domain DNS is set up;
  # then add `cname: status.simplemoneytracker.com` and remove `baseUrl`.
  baseUrl: /status
  themeUrl: https://bacdoxuan.github.io/status/smt-theme.css
  logoUrl: https://icons.duckduckgo.com/ip3/simplemoneytracker.com.ico
  name: Simple Money Tracker Status
  introTitle: "**Simple Money Tracker** status — real-time availability of the web app and the Telegram integration."
  introMessage: Uptime is checked every hour from independent GitHub infrastructure — no server required, powered entirely by GitHub Actions, Issues, and Pages.
  customHeadHtml: |
    <meta name="color-scheme" content="light dark">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("smt-theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.setAttribute("data-theme", stored);
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = stored;
          }
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        var isMounting = false;
        function getSystemTheme() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function getResolvedTheme() {
          var stored = null;
          try { stored = localStorage.getItem('smt-theme'); } catch(e) {}
          if (stored === 'dark' || stored === 'light') return stored;
          return getSystemTheme();
        }
        function applyTheme(target) {
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (target === 'dark' || target === 'light') {
            document.documentElement.setAttribute('data-theme', target);
            if (meta) meta.content = target;
          } else {
            document.documentElement.removeAttribute('data-theme');
            if (meta) meta.content = 'light dark';
          }
        }
        function updateButtonUI(resolvedTheme) {
          var btn = document.getElementById('smt-theme-toggle-btn');
          if (!btn) return;
          var isDark = resolvedTheme === 'dark';
          btn.setAttribute('aria-checked', isDark ? 'true' : 'false');
          btn.setAttribute('title', isDark ? 'Chuyển sang Light Mode' : 'Chuyển sang Dark Mode');
          btn.classList.toggle('is-dark', isDark);
        }
        function toggleTheme() {
          var current = getResolvedTheme();
          var target = current === 'dark' ? 'light' : 'dark';
          var system = getSystemTheme();
          try {
            if (target === system) {
              localStorage.removeItem('smt-theme');
              applyTheme('system');
            } else {
              localStorage.setItem('smt-theme', target);
              applyTheme(target);
            }
          } catch(e) {
            applyTheme(target);
          }
          updateButtonUI(target);
        }
        function mountThemeToggle() {
          if (isMounting) return true;
          var existing = document.getElementById('smt-theme-toggle-btn');
          if (existing && existing.isConnected) {
            updateButtonUI(getResolvedTheme());
            return true;
          }
          var navUl = document.querySelector('nav ul');
          if (!navUl) return false;
          isMounting = true;
          try {
            var old = document.querySelector('.theme-toggle-item');
            if (old && old.parentNode) old.parentNode.removeChild(old);
            var li = document.createElement('li');
            li.className = 'theme-toggle-item';
            li.innerHTML = '<button id="smt-theme-toggle-btn" class="theme-toggle-switch" type="button" role="switch" aria-label="Chuyển chế độ Dark/Light Mode" aria-checked="false" title="Chuyển chế độ Dark/Light Mode"><span class="toggle-icon toggle-sun" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span><span class="toggle-thumb" aria-hidden="true"></span><span class="toggle-icon toggle-moon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span></button>';
            navUl.appendChild(li);
            var btn = document.getElementById('smt-theme-toggle-btn');
            if (btn) btn.addEventListener('click', toggleTheme);
            updateButtonUI(getResolvedTheme());
            return true;
          } finally {
            isMounting = false;
          }
        }
        var observer = new MutationObserver(function() {
          var btn = document.getElementById('smt-theme-toggle-btn');
          if (!btn || !btn.isConnected) mountThemeToggle();
        });
        function startObserver() {
          observer.observe(document.body || document.documentElement, { childList: true, subtree: true });
          mountThemeToggle();
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startObserver);
        } else {
          startObserver();
        }
        var pollCount = 0;
        var pollTimer = setInterval(function() {
          mountThemeToggle();
          pollCount++;
          if (pollCount > 25) clearInterval(pollTimer);
        }, 250);
        window.addEventListener('popstate', function() { setTimeout(mountThemeToggle, 150); });
        window.addEventListener('storage', function(e) {
          if (e.key === 'smt-theme') {
            var current = getResolvedTheme();
            applyTheme(current === getSystemTheme() ? 'system' : current);
            updateButtonUI(current);
          }
        });
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            try {
              if (!localStorage.getItem('smt-theme')) updateButtonUI(e.matches ? 'dark' : 'light');
            } catch(err) {}
          });
        }
      })();
    </script>
  navbar:
    - title: Status
      href: /status
    - title: Home
      href: https://simplemoneytracker.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
