owner: bacdoxuan
repo: status

sites:
  - name: Web App
    url: https://simplemoneytracker.com
    expectedStatusCodes:
      - 200
  - name: Login
    url: https://simplemoneytracker.com/login
    expectedStatusCodes:
      - 200
  - name: Telegram Bot
    url: https://simplemoneytracker.com/api/telegram/webhook
    expectedStatusCodes:
      - 405

status-website:
  # Served at https://bacdoxuan.github.io/status/ until the custom domain DNS is set up;
  # then add `cname: status.simplemoneytracker.com` and remove `baseUrl`.
  baseUrl: /status
  themeUrl: assets/smt-theme.css
  logoUrl: assets/smt-logo.svg
  name: Simple Money Tracker Status
  introTitle: "**Simple Money Tracker** status — real-time availability of the web app and the Telegram integration."
  introMessage: Uptime is checked every hour from independent GitHub infrastructure — no server required, powered entirely by GitHub Actions, Issues, and Pages.
  navbar:
    - title: Status
      href: /
    - title: Home
      href: https://simplemoneytracker.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

workflowSchedule:
  uptime: "0 * * * *"
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 1 1 *"
